<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNN MNIST Dashboard</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- D3.js v7 CDN -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-panel">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <h1>CNN Internals: MNIST Feature Space</h1>
                <button id="theme-toggle" class="btn btn-outline" style="padding: 0.4rem 0.8rem; border-radius: 50%;" title="Toggle Light/Dark Mode">🌙</button>
            </div>
            <div class="header-controls">
                <div class="control-group">
                    <label for="projection-select">Manifold Projection</label>
                    <div class="select-wrapper">
                        <select id="projection-select">
                            <option value="tsne">t-SNE Projection</option>
                            <option value="pca">PCA Projection</option>
                            <option value="star">Star Coordinates</option>
                        </select>
                    </div>
                </div>
                <div class="control-group slider-group" style="width: 350px;">
                    <label for="epoch-slider">Training Timeline: Epoch <span id="epoch-display" class="highlight-text">15</span></label>
                    <input type="range" id="epoch-slider" min="0" max="5" value="5" step="1">
                    <div class="slider-labels" style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-secondary); padding: 0 4px; margin-top: 4px;">
                        <span>0</span><span>1</span><span>3</span><span>5</span><span>10</span><span>15</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Global View -->
            <section class="glass-panel global-view">
                <header class="panel-header">
                    <h2>Global Feature Space</h2>
                    <span class="subtitle">Overview of the 10D manifold</span>
                </header>
                <div id="scatter-container" class="vis-container">
                    <!-- D3 scatter plot -->
                </div>
            </section>

            <!-- Diagnostic View -->
            <section class="glass-panel diagnostic-view">
                <header class="panel-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <h2>Confusion Matrix</h2>
                        <span class="subtitle">Dynamic Diagnostics</span>
                    </div>
                    <button id="reset-filter-btn" class="btn btn-outline" style="padding: 0.3rem 0.8rem; font-size: 0.8rem; display: none;">Reset Filter</button>
                </header>
                <div id="matrix-container" class="vis-container">
                    <!-- D3 heatmap -->
                </div>
            </section>

            <!-- Local View -->
            <section class="glass-panel local-view">
                <header class="panel-header">
                    <h2>Live Inference Engine</h2>
                    <span class="subtitle">Draw to inspect activations</span>
                </header>
                
                <div class="local-view-content">
                    <div class="input-section">
                        <div class="canvas-wrapper">
                            <canvas id="drawing-canvas" width="140" height="140"></canvas>
                        </div>
                        <div class="canvas-actions">
                            <button id="clear-btn" class="btn btn-outline">Clear</button>
                            <button id="submit-btn" class="btn btn-primary">Infer</button>
                        </div>
                    </div>

                    <div class="results-section">
                        <h3>Prediction Confidence</h3>
                        <div id="bar-chart-container" class="vis-container chart-small">
                            <!-- D3 bar chart -->
                        </div>
                    </div>

                    <div class="activations-section">
                        <h3>Network Activations</h3>
                        <div id="feature-maps-container" style="display: flex; flex-direction: column; gap: 16px;">
                            <!-- Activation heatmaps -->
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
